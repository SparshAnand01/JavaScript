<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" >
  <title>Todo App</title>
  <link rel="stylesheet" href="class4.css">
</head>
<body>
  <div id="root">
    <div id="inputDiv">
      <div>
        <label for="title">Title</label>
        <input type="text" placeholder="Enter the title" value="" id="title" required />
      </div>

      <div>
        <label for="description">Description</label>
        <input type="text" placeholder="Enter the Description" value="" id="description" required />
      </div>

      <div>
        <label for="date">Date</label>
        <input type="date" placeholder="Enter the Date" value="" id="date" required />
      </div>

      <div>
        <button type="submit" id="addTodo">Add Todo</button>
      </div>
    </div>

    <div id="listTodo"></div>
  </div>
  <script src="class4.js"></script>
</body>
</html>
