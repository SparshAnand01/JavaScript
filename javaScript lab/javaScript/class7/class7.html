<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
   #btn-event-helper{
    height: 100px;
    width: 100px;
    border: 2px solid red;
   } 
</style>
<body>
    <h2>Events</h2>
    <!-- 
    Mouse : click, hover, scroll, right click , left click, dbclick
    Keyboard : keypress
    Touch  : 
    -->

    <div id="btn-event-helper"></div>

    <button id="btn-events">Change BG
    </button>
    <h2>Keyboard events</h2>
    <input type="">
    <p></p>

    <script>
// task
        // -> btn -> hover : lightblue
        // -> btn -> right click : lightred
        // -> btn -> left click : lightcyan

        let button=document.querySelector("button");
        button.addEventListener("click",function(){
            let box = document.querySelector("div");
            box.style.backgroundColor="blue";

        })
         button.addEventListener("mouseenter", function() {
         let div=document.querySelector("#btn-event-helper");
    div.style.backgroundColor="red";
})

         button.addEventListener("mouseleave", function() {
         let div=document.querySelector("div");
        div.style.backgroundColor="green";
})

         button.addEventListener("contextmenu", function(e) {
            e.preventDefault();
         let div=document.querySelector("div");
        div.style.backgroundColor="yellow";
         })



         //keyboard input
         //1.input selection
         let input=document.querySelector("input");
         //2.whenever any keyboard key is pressed then i want to know what has 
         let str="";
         input.addEventListener("keydown",function(e){

            console.log("event object",e.key);
            let p= document.querySelector("p");
            str=str+e.key;
            p.textContent=str;
         })
    </script>

</body>
</html>
