<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
     <script src="script.js" defer></script>
     <link rel="stylesheet" href="html.css">
     
</head>
<body>
    <div style="display: flex; flex-direction: column;gap: 10px; justify-content: center; align-items: center; height: 100vh;">
        <h1>
            Calculator
        </h1>
        <div> 
            <label for="inputone"> First Input</label>
            <input type="number" placeholder="enter number one" id="inputone" required>
        </div><br>
        <div>
            <label for="inputtwo">Second Input</label>
            <input type="number" placeholder="enter number two" id="inputtwo" required>
        </div><br>
        <div>
            <button id="add">+</button>
            <button id="sub">-</button>
            <button id="mul">*</button>
            <button id="divi">/</button>
        </div><br>
        <div>
            <button id="">Calculate</button>
            <p>Output is: <span></span></p>

        </div>


    </div>
    
</body>
</html>
